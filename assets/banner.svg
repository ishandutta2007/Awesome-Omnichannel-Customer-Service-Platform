<svg fill="none" viewBox="0 0 1200 360" width="100%" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dynamic Flow Line Animations -->
    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes dashAnim {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbMove {
        0%, 100% { cx: 200px; cy: 80px; }
        50% { cx: 280px; cy: 120px; }
      }
      .floating-node-1 { animation: floatSlow 6s ease-in-out infinite; }
      .floating-node-2 { animation: floatReverse 7s ease-in-out infinite; }
      .pulse-glow { animation: pulse 4s ease-in-out infinite; }
      .flow-path {
        stroke-dasharray: 8 6;
        animation: dashAnim 15s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="pulse-glow" opacity="0.6">
    <circle cx="150" cy="90" r="120" fill="#3b82f6" filter="url(#glow)" opacity="0.15" />
    <circle cx="1050" cy="180" r="140" fill="#ec4899" filter="url(#glow)" opacity="0.12" />
    <circle cx="600" cy="280" r="100" fill="#8b5cf6" filter="url(#glow)" opacity="0.12" />
  </g>

  <!-- Dynamic Network Channels / Flow Lines in Midground (kept subtle & below text) -->
  <g stroke="#334155" stroke-width="1.5" fill="none" opacity="0.4">
    <path class="flow-path" d="M 120 70 Q 300 130, 600 70 T 1080 70" stroke="#38bdf8" />
    <path class="flow-path" d="M 80 290 Q 350 210, 600 290 T 1120 290" stroke="#c084fc" />
    <line x1="220" y1="70" x2="260" y2="290" stroke="#64748b" stroke-dasharray="4 4" opacity="0.3" />
    <line x1="980" y1="70" x2="940" y2="290" stroke="#64748b" stroke-dasharray="4 4" opacity="0.3" />
  </g>

  <!-- Left Channel Badges (Dynamic Floating) -->
  <g class="floating-node-1" filter="url(#shadow)">
    <!-- Email Pill -->
    <rect x="50" y="55" width="130" height="38" rx="19" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="115" y="79" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">✉️ Email &amp; Web</text>
    
    <!-- WhatsApp & SMS Pill -->
    <rect x="70" y="145" width="150" height="38" rx="19" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
    <text x="145" y="169" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">💬 WhatsApp &amp; SMS</text>

    <!-- Social DMs Pill -->
    <rect x="40" y="235" width="145" height="38" rx="19" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.2" />
    <text x="112" y="259" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📱 Social &amp; In-App</text>
  </g>

  <!-- Right Channel Badges (Dynamic Floating Reverse) -->
  <g class="floating-node-2" filter="url(#shadow)">
    <!-- AI Agents Pill -->
    <rect x="1005" y="55" width="145" height="38" rx="19" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" />
    <text x="1077" y="79" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🤖 AI Agent Copilot</text>

    <!-- Unified Inbox Pill -->
    <rect x="975" y="145" width="165" height="38" rx="19" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.2" />
    <text x="1057" y="169" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📥 360° Unified Inbox</text>

    <!-- Self-Hosted Pill -->
    <rect x="1015" y="235" width="140" height="38" rx="19" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.2" />
    <text x="1085" y="259" fill="#a5f3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🛡️ Self-Hosted OSS</text>
  </g>

  <!-- Central Foreground Content (Unobscured & Clear) -->
  <g id="foreground-title" filter="url(#shadow)">
    <!-- Central Pill Category Tag -->
    <rect x="475" y="48" width="250" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="600" y="68" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED AWESOME DIRECTORY</text>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5" text-anchor="middle">Awesome Omnichannel</text>
    <text x="600" y="195" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" text-anchor="middle">Customer Service Platform</text>

    <!-- Subtitle -->
    <text x="600" y="240" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" text-anchor="middle">Top SaaS Customer Support Suites &amp; Open-Source Helpdesk Solutions</text>

    <!-- Feature Icons / Micro-tags -->
    <g transform="translate(425, 275)">
      <rect x="0" y="0" width="105" height="26" rx="13" fill="#1e293b" stroke="#334155" />
      <text x="52" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="middle">⚡ Shared Inbox</text>

      <rect x="120" y="0" width="110" height="26" rx="13" fill="#1e293b" stroke="#334155" />
      <text x="175" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="middle">🎯 Live Ticketing</text>

      <rect x="245" y="0" width="105" height="26" rx="13" fill="#1e293b" stroke="#334155" />
      <text x="297" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="middle">🤖 AI Automation</text>
    </g>
  </g>
</svg>
